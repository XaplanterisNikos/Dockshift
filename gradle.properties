# Project-wide Gradle settings.
# Settings made in the Android Studio UI override the ones in this file.

# Memory for the Gradle daemon; UTF-8 so Greek strings compile correctly
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use AndroidX libraries (the support library is long gone)
android.useAndroidX=true
# Each module's R class only contains its own resources (faster, smaller builds)
android.nonTransitiveRClass=true
# Kotlin formatting rules used by the IDE
kotlin.code.style=official
