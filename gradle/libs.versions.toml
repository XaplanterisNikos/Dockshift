# Version catalog: the single place where every dependency and plugin version lives.
# Build scripts refer to these entries as `libs.<name>` / `libs.plugins.<name>`.

[versions]
# Android Gradle Plugin 9.x compiles Kotlin itself (built-in Kotlin),
# so there is no separate `org.jetbrains.kotlin.android` plugin here.
agp = "9.4.0"
# Kotlin version; the Compose compiler and Kotlin/JVM plugins must use the same one.
kotlin = "2.4.21"
# Kotlin Symbol Processing: code generation for Hilt (and Room later).
# Since 2.3.x its version no longer follows the Kotlin version.
ksp = "2.3.11"
# Compose Bill of Materials: keeps all Compose libraries on matching versions.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
# Dagger/Hilt (2.59+ is required for AGP 9)
hilt = "2.60.1"
# AndroidX helpers for Hilt (hiltViewModel() in Compose)
androidxHilt = "1.4.0"
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# The Compose libraries below have no version: the BOM provides it.
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ViewModel and lifecycle-aware state collection in Compose
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Key-value settings storage
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Dependency injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# Coroutines (Flow) for the pure Kotlin domain module, and test helpers
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# For the :domain module only (plain Kotlin/JVM, no Android)
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
