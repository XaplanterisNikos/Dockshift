# Version catalog: the single place where every dependency and plugin version lives.
# Build scripts refer to these entries as `libs.<name>` / `libs.plugins.<name>`.

[versions]
# Android Gradle Plugin 9.x compiles Kotlin itself (built-in Kotlin),
# so there is no separate `org.jetbrains.kotlin.android` plugin here.
agp = "9.4.0"
# Kotlin version; the Compose compiler and Kotlin/JVM plugins must use the same one.
kotlin = "2.4.21"
# Kotlin Symbol Processing: code generation for Hilt (and Room later).
# Since 2.3.x its version no longer follows the Kotlin version.
ksp = "2.3.11"
# Compose Bill of Materials: keeps all Compose libraries on matching versions.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
# Dagger/Hilt (2.59+ is required for AGP 9)
hilt = "2.60.1"
# AndroidX helpers for Hilt (hiltViewModel() in Compose)
androidxHilt = "1.4.0"
coroutines = "1.11.0"
# Room 3: coroutine-first database on top of a SQLiteDriver
room3 = "3.0.3"
# androidx.sqlite: provides the bundled SQLite driver used by Room
sqlite = "2.7.1"
# Navigation 3: Compose-first navigation with a back stack we own
navigation3 = "1.2.0"
# Saves the navigation back stack (screen keys are @Serializable)
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
# Instrumented (on-device) tests
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# The Compose libraries below have no version: the BOM provides it.
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ViewModel and lifecycle-aware state collection in Compose
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Key-value settings storage
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Dependency injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# Coroutines (Flow) for the pure Kotlin domain module, and test helpers
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Navigation: back stack + display, and one ViewModel store per screen entry
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Database
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# Instrumented tests (run on an emulator or device)
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# For the :domain module only (plain Kotlin/JVM, no Android)
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# Generates serializers for @Serializable classes (navigation keys); same version as Kotlin
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Room 3 Gradle plugin: exports the database schema for migrations
room3 = { id = "androidx.room3", version.ref = "room3" }
